name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: digishop_owner
          POSTGRES_PASSWORD: ci-owner-fixture
          POSTGRES_DB: digishop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U digishop_owner -d digishop_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://digishop_app:ci-app-fixture@127.0.0.1:5432/digishop_test
      DIRECT_DATABASE_URL: postgresql://digishop_owner:ci-owner-fixture@127.0.0.1:5432/digishop_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:auth:e2e
      - run: pnpm test:auth:dev
      - run: pnpm test:e2e:dev --workers=2
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
