services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: digishop_owner
      POSTGRES_PASSWORD: local-only-owner
      POSTGRES_DB: digishop
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-local.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digishop_owner -d digishop']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
